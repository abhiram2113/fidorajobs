<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Resume match</title><desc id="desc">A recreated illustrative resume upload and match snapshot based on the real profile screenshot.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fffa"/><stop offset="1" stop-color="#e6f7ec"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#174b32" flood-opacity=".12"/></filter></defs><rect width="1200" height="700" rx="30" fill="url(#bg)"/><rect x="28" y="28" width="1144" height="644" rx="22" fill="#fff" filter="url(#shadow)"/><rect x="28" y="28" width="1144" height="66" rx="22" fill="#fff"/><path d="M28 72V94H1172V72" fill="#fff"/><rect x="48" y="45" width="34" height="34" rx="10" fill="#147a50"/><text x="65" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d7ffb4">F</text><text x="94" y="59" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16382a">fidora<tspan fill="#147a50">jobs</tspan></text><text x="94" y="76" font-family="Arial,sans-serif" font-size="9" letter-spacing="2" fill="#7b9284">YOUR CAREER, IN MOTION</text><rect x="28" y="94" width="205" height="578" fill="#f4fbf6"/><text x="54" y="128" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#799080">WORKSPACE</text><text x="55" y="164" font-family="Arial,sans-serif" font-size="14" fill="#286246">▣  Overview</text><text x="55" y="205" font-family="Arial,sans-serif" font-size="14" fill="#286246">⌕  Discover jobs</text><text x="55" y="246" font-family="Arial,sans-serif" font-size="14" fill="#286246">☆  Saved jobs</text><text x="55" y="287" font-family="Arial,sans-serif" font-size="14" fill="#286246">✓  Applied jobs</text><text x="55" y="328" font-family="Arial,sans-serif" font-size="14" fill="#286246">▤  My profile</text><text x="265" y="132" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#147a50">RESUME MATCH</text><text x="265" y="166" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18382a">A recreated illustrative resume upload and match snapshot based on the real profile screenshot.</text><rect x="265" y="195" width="500" height="390" rx="16" fill="#fff" stroke="#dceee2"/><text x="290" y="232" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18382a">Upload your resume</text><text x="290" y="257" font-family="Arial,sans-serif" font-size="12" fill="#718578">Use your resume to estimate relevance to available roles.</text><rect x="290" y="280" width="450" height="105" rx="12" fill="#f7fcf8" stroke="#b8dec5" stroke-dasharray="7 5"/><circle cx="515" cy="315" r="18" fill="#d9f3e1"/><path d="M515 326V304M507 312L515 304L523 312" stroke="#147a50" stroke-width="3" fill="none" stroke-linecap="round"/><text x="515" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#2b6746">Choose your resume file</text><text x="290" y="416" font-family="Arial,sans-serif" font-size="12" fill="#718578">PDF, DOCX, DOC, RTF or TXT · follow portal file-size limits</text><rect x="290" y="438" width="172" height="40" rx="9" fill="#147a50"/><text x="376" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">Upload &amp; analyze</text><text x="290" y="520" font-family="Arial,sans-serif" font-size="12" fill="#718578">The match is an estimate based on available resume and job text.</text><rect x="790" y="195" width="340" height="390" rx="16" fill="#f6fcf8" stroke="#dceee2"/><text x="820" y="232" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18382a">Match snapshot</text><circle cx="960" cy="350" r="78" fill="#fff" stroke="#ccebd5" stroke-width="13"/><path d="M960 272 A78 78 0 0 1 1025 307" stroke="#147a50" stroke-width="13" fill="none" stroke-linecap="round"/><text x="960" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#147a50">%</text><text x="960" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#718578">ESTIMATED ALIGNMENT</text><text x="820" y="474" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#18382a">What does the score mean?</text><text x="820" y="500" font-family="Arial,sans-serif" font-size="12" fill="#587463">How closely your resume/profile</text><text x="820" y="520" font-family="Arial,sans-serif" font-size="12" fill="#587463">matches the job description's skills</text><text x="820" y="540" font-family="Arial,sans-serif" font-size="12" fill="#587463">and keywords—not hiring odds.</text></svg>