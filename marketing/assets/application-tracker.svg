ofile</text><text x="265" y="132" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#147a50">APPLICATION TRACKER</text><text x="265" y="166" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18382a">A recreated illustrative tracker screen based on the actual FidoraJobs applied jobs screenshot.</text><text x="265" y="202" font-family="Arial,sans-serif" font-size="14" fill="#617a69">Review saved and applied roles in one organized place.</text><rect x="265" y="226" width="865" height="66" rx="13" fill="#f8fcf9" stroke="#dceee2"/><text x="288" y="252" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#466452">QUICK RANGE</text><rect x="405" y="240" width="185" height="31" rx="7" fill="#fff" stroke="#d5e7db"/><text x="418" y="260" font-family="Arial,sans-serif" font-size="12" fill="#496653">All dates ▾</text><rect x="604" y="240" width="185" height="31" rx="7" fill="#fff" stroke="#d5e7db"/><text x="617" y="260" font-family="Arial,sans-serif" font-size="12" fill="#849589">From date</text><rect x="803" y="240" width="185" height="31" rx="7" fill="#fff" stroke="#d5e7db"/><text x="816" y="260" font-family="Arial,sans-serif" font-size="12" fill="#849589">To date</text><rect x="265" y="320" width="410" height="155" rx="15" fill="#fff" stroke="#dceee2"/><rect x="283" y="338" width="40" height="40" rx="12" fill="#e8f8ed"/><circle cx="303" cy="358" r="9" fill="#147a50"/><text x="337" y="354" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1b3d2b">Software Engineer · Java</text><text x="337" y="376" font-family="Arial,sans-serif" font-size="12" fill="#718578">Saved role · Official source available</text><text x="285" y="455" font-family="Arial,sans-serif" font-size="12" fill="#4e6a59">Mark applied when you've submitted</text><rect x="700" y="320" width="430" height="155" rx="15" fill="#fff" stroke="#dceee2"/><rect x="718" y="338" width="40" height="40" rx="12" fill="#e8f8ed"/><circle cx="738" cy="358" r="9" fill="#62a96d"/><text x="772" y="354" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1b3d2b">Platform Systems Analyst</text><text x="772" y="376" font-family="Arial,sans-serif" font-size="12" fill="#718578">Applied role · Track your own progress</text><text x="720" y="455" font-family="Arial,sans-serif" font-size="12" fill="#4e6a59">Revisit the employer's application page</text><rect x="265" y="500" width="865" height="100" rx="15" fill="#eaf8ef"/><text x="292" y="538" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#18382a">Keep your search organized</text><text x="292" y="566" font-family="Arial,sans-serif" font-size="13" fill="#587463">Save jobs you want to revisit and mark the roles you have applied for.</text></svg>