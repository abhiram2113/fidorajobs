<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Discover jobs</title><desc id="desc">A recreated illustrative view of job search filters and role cards based on the portal screenshot.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fffa"/><stop offset="1" stop-color="#e6f7ec"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#174b32" flood-opacity=".12"/></filter></defs><rect width="1200" height="700" rx="30" fill="url(#bg)"/><rect x="28" y="28" width="1144" height="644" rx="22" fill="#fff" filter="url(#shadow)"/><rect x="28" y="28" width="1144" height="66" rx="22" fill="#fff"/><path d="M28 72V94H1172V72" fill="#fff"/><rect x="48" y="45" width="34" height="34" rx="10" fill="#147a50"/><text x="65" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d7ffb4">F</text><text x="94" y="59" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#16382a">fidora<tspan fill="#147a50">jobs</tspan></text><text x="94" y="76" font-family="Arial,sans-serif" font-size="9" letter-spacing="2" fill="#7b9284">YOUR CAREER, IN MOTION</text><rect x="28" y="94" width="205" height="578" fill="#f4fbf6"/><text x="54" y="128" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#799080">WORKSPACE</text><text x="55" y="164" font-family="Arial,sans-serif" font-size="14" fill="#286246">▣  Overview</text><text x="55" y="205" font-family="Arial,sans-serif" font-size="14" fill="#286246">⌕  Discover jobs</text><text x="55" y="246" font-family="Arial,sans-serif" font-size="14" fill="#286246">☆  Saved jobs</text><text x="55" y="287" font-family="Arial,sans-serif" font-size="14" fill="#286246">✓  Applied jobs</text><text x="55" y="328" font-family="Arial,sans-serif" font-size="14" fill="#286246">▤  My profile</text><text x="265" y="132" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#147a50">DISCOVER JOBS</text><text x="265" y="166" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18382a">A recreated illustrative view of job search filters and role cards based on the portal screenshot.</text><text x="265" y="202" font-family="Arial,sans-serif" font-size="14" fill="#617a69">Search by role, company, location, domain and posting date.</text><rect x="265" y="224" width="865" height="72" rx="13" fill="#f8fcf9" stroke="#dceee2"/><rect x="283" y="242" width="270" height="36" rx="7" fill="#fff" stroke="#d5e7db"/><text x="296" y="264" font-family="Arial,sans-serif" font-size="12" fill="#849589">Role, skill, company, keyword...</text><rect x="565" y="242" width="130" height="36" rx="7" fill="#fff" stroke="#d5e7db"/><text x="578" y="264" font-family="Arial,sans-serif" font-size="12" fill="#496653">Country ▾</text><rect x="707" y="242" width="160" height="36" rx="7" fill="#fff" stroke="#d5e7db"/><text x="720" y="264" font-family="Arial,sans-serif" font-size="12" fill="#496653">State / province</text><rect x="879" y="242" width="135" height="36" rx="7" fill="#fff" stroke="#d5e7db"/><text x="892" y="264" font-family="Arial,sans-serif" font-size="12" fill="#496653">Job domain ▾</text><rect x="1026" y="242" width="86" height="36" rx="7" fill="#147a50"/><text x="1069" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">Find roles</text><rect x="265" y="320" width="270" height="138" rx="15" fill="#fff" stroke="#dceee2"/><rect x="283" y="338" width="40" height="40" rx="12" fill="#e8f8ed"/><circle cx="303" cy="358" r="9" fill="#147a50"/><text x="337" y="354" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1b3d2b">Software Engineer</text><text x="337" y="376" font-family="Arial,sans-serif" font-size="12" fill="#718578">Technology · Location varies</text><text x="285" y="438" font-family="Arial,sans-serif" font-size="12" fill="#4e6a59">Official company link ↗</text><rect x="550" y="320" width="270" height="138" rx="15" fill="#fff" stroke="#dceee2"/><rect x="568" y="338" width="40" height="40" rx="12" fill="#e8f8ed"/><circle cx="588" cy="358" r="9" fill="#62a96d"/><text x="622" y="354" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1b3d2b">Data Analyst</text><text x="622" y="376" font-family="Arial,sans-serif" font-size="12" fill="#718578">Analytics · Location varies</text><text x="570" y="438" font-family="Arial,sans-serif" font-size="12" fill="#4e6a59">Official company link ↗</text><rect x="835" y="320" width="295" height="138" rx="15" fill="#fff" stroke="#dceee2"/><rect x="853" y="338" width="40" height="40" rx="12" fill="#e8f8ed"/><circle cx="873" cy="358" r="9" fill="#75b94f"/><text x="907" y="354" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1b3d2b">Business Analyst</text><text x="907" y="376" font-family="Arial,sans-serif" font-size="12" fill="#718578">Business · Location varies</text><text x="855" y="438" font-family="Arial,sans-serif" font-size="12" fill="#4e6a59">Official company link ↗</text><rect x="265" y="482" width="865" height="130" rx="15" fill="#eaf8ef"/><text x="292" y="520" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#18382a">Look for recently posted opportunities</text><text x="292" y="549" font-family="Arial,sans-serif" font-size="13" fill="#587463">Use the posting-date filter to narrow results to the past 24 hours where verified dates are available.</text><text x="292" y="578" font-family="Arial,sans-serif" font-size="12" fill="#147a50">Always verify the vacancy and requirements on the employer's official site.</text></svg>